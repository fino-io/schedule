version: 2

dist: .fino/release

project_name: schedule

release:
  disable: true

before:
  hooks:
    - sh -c "cd backend && go mod tidy"
    - sh -c "cd frontend && npm ci && npm run build"

builds:
  - id: schedule-server
    dir: backend
    main: ./cmd/schedule-server
    binary: schedule-server
    goos:
      - linux
    goarch:
      - amd64
    flags:
      - -trimpath
      - -buildvcs=false
    ldflags:
      - -s -w -X main.gitHash={{ .ShortCommit }} -X main.gitBranch={{ .Branch }} -X main.buildTime={{ .Date }}

archives:
  - id: backend
    ids:
      - schedule-server
    formats:
      - tar.gz
    name_template: >-
      {{ .ProjectName }}_
      {{- .Os }}_
      {{- if eq .Arch "amd64" }}x86_64
      {{- else }}{{ .Arch }}{{ end }}

  - id: deployment
    meta: true
    formats:
      - tar.gz
    name_template: "{{ .ProjectName }}_deployment"
    files:
      - deploy/**/*
      - backend/configs/**/*

checksum:
  name_template: checksums.txt

dockers_v2:
  - id: schedule-server
    ids:
      - schedule-server
    dockerfile: backend/build/schedule-server/Dockerfile
    images:
      - schedule/schedule-server
    tags:
      - "{{ .Tag }}"
      - "{{ if .IsSnapshot }}latest{{ else }}latest-amd64{{ end }}"
    platforms:
      - linux/amd64
    sbom: false
    labels:
      org.opencontainers.image.title: schedule-server
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.ref.name: "{{ .Branch }}"

  - id: schedule-frontend
    dockerfile: frontend/Dockerfile
    extra_files:
      - frontend/Caddyfile
      - .fino/frontend
    images:
      - schedule/schedule-frontend
    tags:
      - "{{ .Tag }}"
      - "{{ if .IsSnapshot }}latest{{ else }}latest-amd64{{ end }}"
    platforms:
      - linux/amd64
    sbom: false
    labels:
      org.opencontainers.image.title: schedule-frontend
      org.opencontainers.image.revision: "{{ .FullCommit }}"
      org.opencontainers.image.ref.name: "{{ .Branch }}"
