syntax = "proto3";

package schedule;

option go_package = "github.com/fino-io/schedule/go/schedule;schedule";

// 独立的业务状态流，不参与工作流执行生命周期。允许自环、循环和单态图。
message StateflowDefinition {
  string init = 1;
  repeated StateflowStep steps = 2;
}

// 通过目标状态选择转换；event 是转换输出标签，不是输入触发器。
message StateflowStep {
  string from = 1;
  string to = 2;
  string event = 3;
}

message StateflowInstance {
  StateflowDefinition definition = 1;
  string state = 2;
}
