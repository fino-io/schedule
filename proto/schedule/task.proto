syntax = "proto3";

package schedule;

option go_package = "github.com/fino-io/schedule/go/schedule;schedule";

enum NodeKind {
  NODE_KIND_UNSPECIFIED = 0;
  NODE_KIND_TASK = 1;
  NODE_KIND_SEQ = 2;
  NODE_KIND_ALL = 3;
  NODE_KIND_ANY = 4;
}

// 静态组合树。每个节点代表一次执行位置，ID 在定义内唯一。
// Task 没有子项；Seq/All/Any 的子项非空，只有 Task 产生执行命令。
message Node {
  string id = 1;
  string name = 2;
  NodeKind kind = 3;
  repeated Node children = 4;

  // 业务元数据由执行器解释，编排器不执行处理器或隐式传递输出。
  string type = 5;
  string entity_id = 6;
  string operation_name = 7;
}
