syntax = "proto3";

package schedule;

import "schedule/task.proto";

option go_package = "github.com/fino-io/schedule/go/schedule;schedule";

enum Phase {
  PHASE_UNSPECIFIED = 0;
  PHASE_PENDING = 1;
  PHASE_READY = 2;
  PHASE_RUNNING = 3;
  PHASE_SUCCEEDED = 4;
  PHASE_FAILED = 5;
  PHASE_STOPPED = 6;
  PHASE_SKIPPED = 7;
}

enum Mode {
  MODE_UNSPECIFIED = 0;
  MODE_RUNNING = 1;
  MODE_PAUSED = 2;
  MODE_STOPPED = 3;
}

enum EventKind {
  EVENT_KIND_UNSPECIFIED = 0;
  EVENT_KIND_STARTED = 1;
  EVENT_KIND_SUCCEEDED = 2;
  EVENT_KIND_FAILED = 3;
  EVENT_KIND_STOPPED = 4;
  EVENT_KIND_PAUSE = 5;
  EVENT_KIND_RESUME = 6;
  EVENT_KIND_STOP = 7;
}

enum CommandKind {
  COMMAND_KIND_UNSPECIFIED = 0;
  COMMAND_KIND_TASK = 1;
  COMMAND_KIND_STATE = 2;
  COMMAND_KIND_END = 3;
}

message Definition {
  Node root = 1;
}

// 调用方按 ID 原子创建实例，并用 revision 控制并发更新。
// 快照与命令、已接受事件 ID 必须在同一事务中保存。
message Instance {
  string id = 1;
  string definition_hash = 2;
  uint64 revision = 3;
  Mode mode = 4;
  // 严格按定义树前序排列，每个节点恰好一项。
  repeated NodeState nodes = 5;
}

message NodeState {
  string node_id = 1;
  Phase phase = 2;
  // 只供已产生分派意图的 Task 使用，重试不改变逻辑执行标识。
  string execution_id = 3;
  // 未设置与显式空字符串不同；不能由文本恢复 Go 错误链。
  optional string error_message = 4;
  // 由执行器管理的结果引用，不在快照内存放业务输出。
  string result_ref = 5;
  // Any 首次成功的直接子项，锁定后不再修改。
  string winner_id = 6;
  // Seq/All 失败的直接子项，或跳过/停止的控制来源。
  string cause_id = 7;
}

// STARTED/SUCCEEDED/FAILED/STOPPED 是叶子报告，绑定实例、节点和逻辑执行。
// PAUSE/RESUME/STOP 是实例控制，node_id/execution_id 及结果载荷必须为空。
// 事件 ID 的持久化去重由接入方负责；核心另外保证重复报告的语义幂等。
message Event {
  string id = 1;
  string instance_id = 2;
  EventKind kind = 3;
  string node_id = 4;
  string execution_id = 5;
  optional string error_message = 6;
  string result_ref = 7;
}

// 自包含、可持久化的执行或通知意图。接入方按 id 幂等投递。
// STATE 包含节点状态变化或根的控制模式变化；END 只在首次全部收尾时产生。
message Command {
  string id = 1;
  string instance_id = 2;
  string definition_hash = 3;
  uint64 revision = 4;
  CommandKind kind = 5;
  NodeState state = 6;
  Phase previous_phase = 7;
  Mode mode = 8;
  Mode previous_mode = 9;
  repeated string path = 10;
  // 只有 TASK 命令包含叶子定义，通知无需重新装载整棵树。
  Node task = 11;
}

message Transition {
  Instance instance = 1;
  // 固定按状态通知、任务分派、结束通知排列；同类按定义顺序输出。
  repeated Command commands = 2;
  // 派生视图：根结果已确定，不表示其他分支已经收尾。
  bool result_ready = 3;
  // 派生视图：全部节点已终结，没有剩余执行或待激活后继。
  bool settled = 4;
}
